<div class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 mt-4">

    <!-- =========================
       PRESETS DE FECHA
       ========================= -->
    <div *ngIf="!showSingleDate()" class="flex flex-wrap gap-2 items-center">

        <span class="text-xs font-semibold text-gray-500 mr-2">
      Fecha:
    </span>

        <button *ngFor="let p of presets" type="button" (click)="emitPreset(p.value)" class="px-3 py-1.5 rounded-full text-xs border transition" [ngClass]="
        selectedPreset() === p.value
          ? 'bg-indigo-600 text-white border-indigo-600'
          : 'bg-gray-100 text-gray-700 border-gray-300 hover:bg-gray-200'
      ">
      {{ p.label }}
    </button>

        <!-- Acción secundaria -->
        <button type="button" class="ml-auto text-xs text-indigo-600 hover:underline" (click)="enableSingleDate()">
      📅 Elegir día específico
    </button>

    </div>

    <!-- =========================
       FECHA ESPECÍFICA
       ========================= -->
    <div *ngIf="showSingleDate()" class="flex items-center gap-3">

        <span class="text-xs text-gray-500">
      Día:
    </span>

        <input type="date" class="border border-gray-300 rounded-lg px-3 py-1.5 text-xs
             focus:outline-none focus:ring-2 focus:ring-indigo-500" (change)="emitSingleDate($any($event.target).value)" />

    </div>

    <!-- =========================
       CHIP DE FILTRO ACTIVO
       (solo si hay fecha)
       ========================= -->
    <div *ngIf="activeLabel()" class="mt-3 flex items-center gap-2">

        <span class="text-xs text-gray-500">
      Filtro activo:
    </span>

        <div class="flex items-center gap-1 px-3 py-1 rounded-full
             bg-indigo-100 text-indigo-700 text-xs font-medium">
            📅 {{ activeLabel() }}

            <button type="button" class="ml-1 hover:text-red-500" (click)="clearDate()" aria-label="Quitar filtro de fecha">
        ✕
      </button>
        </div>

    </div>

</div>
